<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Muzaqil Hesenli — Data Science & AI, live 3D</title>
  <script src="https://browser.sentry-cdn.com/8.47.0/bundle.tracing.min.js" crossorigin="anonymous"></script>
  <script>
    Sentry.init({
      dsn: "https://13cd35f74ebc59b926b4a7802ff00fb3@o4512068083122176.ingest.us.sentry.io/4512070313246720",
      tracesSampleRate: 0.2,
      environment: "github-pages",
    });
  </script>
  <style>
    :root {
      --bg: #05080f;
      --ink: #e6edf3;
      --muted: #8b949e;
      --teal: #5eead4;
      --violet: #a78bfa;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, Segoe UI, sans-serif;
    }
    #city {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .card3d {
      width: max-content;
      max-width: 220px;
      pointer-events: auto;
      background: rgba(7, 11, 20, 0.55);
      border: 1px solid rgba(94, 234, 212, 0.32);
      border-radius: 14px;
      padding: 8px 10px;
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 50px rgba(0,0,0,0.4);
    }
    .card3d.metrics { max-width: 200px; padding: 6px; }
    .links { display: flex; gap: 6px; flex-wrap: wrap; }
    .links a {
      color: var(--ink);
      text-decoration: none;
      border: 1px solid rgba(167, 139, 250, 0.4);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
    }
    .metrics h2 {
      margin: 0 0 6px;
      font-size: 10px;
      letter-spacing: 0.16em;
      color: var(--violet);
    }
    .metrics img { width: 100%; height: auto; display: block; }
    .label3d {
      color: var(--teal);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(94, 234, 212, 0.8);
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="city" aria-label="Live 3D Data Science and AI world"></canvas>

  <div id="links" class="card3d">
    <div class="links">
      <a href="mailto:mhesenli7@std.beu.edu.az">Email</a>
      <a href="https://github.com/Muzaqil555">GitHub</a>
      <a href="https://www.linkedin.com/in/muzaqil-hesenli-111837381">LinkedIn</a>
      <a href="https://github.com/Muzaqil555/AIA">AIA</a>
    </div>
  </div>

  <aside id="stats" class="card3d metrics">
    <h2>LIVE METRICS</h2>
    <img data-live-src="https://gh-stats.work/api?username=Muzaqil555&show_icons=true&hide_border=true&bg_color=05080F&title_color=5EEAD4&icon_color=A78BFA&text_color=C9D1D9" alt="GitHub stats" />
    <img data-live-src="https://gh-stats.work/api/top-langs/?username=Muzaqil555&layout=compact&langs_count=6&hide_border=true&bg_color=05080F&title_color=5EEAD4&text_color=C9D1D9" alt="Top languages" />
  </aside>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "https://unpkg.com/three@0.170.0/examples/jsm/controls/OrbitControls.js";
    import { GLTFLoader } from "https://unpkg.com/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";
    import { EffectComposer } from "https://unpkg.com/three@0.170.0/examples/jsm/postprocessing/EffectComposer.js";
    import { RenderPass } from "https://unpkg.com/three@0.170.0/examples/jsm/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "https://unpkg.com/three@0.170.0/examples/jsm/postprocessing/UnrealBloomPass.js";
    import { CSS2DRenderer, CSS2DObject } from "https://unpkg.com/three@0.170.0/examples/jsm/renderers/CSS2DRenderer.js";

    const HIGGSFIELD_NEURAL = [
      "./models/neural-net.glb",
      "https://d8j0ntlcm91z4.cloudfront.net/user_3IuuhUikrHs5vVwCBcIqgQC4I6o/hf_20260911_233542_b4e0c73d-a8bc-4d73-8dc2-a89673daf58a.glb",
    ];

    const canvas = document.getElementById("city");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05080f);
    scene.fog = new THREE.FogExp2(0x05080f, 0.016);

    const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 220);
    camera.position.set(18, 11, 20);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.62;
    controls.maxPolarAngle = Math.PI / 2.08;
    controls.minDistance = 12;
    controls.maxDistance = 40;
    controls.target.set(0, 2.4, 0);

    const labels = new CSS2DRenderer();
    labels.setSize(innerWidth, innerHeight);
    labels.domElement.style.position = "fixed";
    labels.domElement.style.inset = "0";
    labels.domElement.style.pointerEvents = "none";
    document.body.appendChild(labels.domElement);

    scene.add(new THREE.AmbientLight(0xb9c6ff, 0.5));
    const teal = new THREE.PointLight(0x5eead4, 80, 90);
    teal.position.set(-12, 16, 10);
    scene.add(teal);
    const violet = new THREE.PointLight(0xa78bfa, 70, 90);
    violet.position.set(14, 14, -8);
    scene.add(violet);
    const sun = new THREE.DirectionalLight(0xffffff, 0.45);
    sun.position.set(6, 28, 8);
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(38, 80),
      new THREE.MeshStandardMaterial({ color: 0x070b14, roughness: 0.9, metalness: 0.2 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(16.5, 0.04, 12, 180),
      new THREE.MeshBasicMaterial({ color: 0x5eead4, transparent: true, opacity: 0.42 })
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.05;
    scene.add(ring);

    function makeLabel(text, position) {
      const el = document.createElement("div");
      el.className = "label3d";
      el.textContent = text;
      const obj = new CSS2DObject(el);
      obj.position.copy(position);
      scene.add(obj);
    }

    function makeTitleSprite(lines, width, height, worldW, worldH) {
      const c = document.createElement("canvas");
      c.width = width;
      c.height = height;
      const ctx = c.getContext("2d");
      ctx.clearRect(0, 0, width, height);
      ctx.textAlign = "center";
      ctx.shadowColor = "#5eead4";
      ctx.shadowBlur = 24;
      ctx.fillStyle = "#5eead4";
      ctx.font = "700 42px Inter, Segoe UI, sans-serif";
      ctx.fillText(lines[0], width / 2, 56);
      ctx.shadowBlur = 12;
      ctx.fillStyle = "#e6edf3";
      ctx.font = "800 78px Inter, Segoe UI, sans-serif";
      ctx.fillText(lines[1], width / 2, 148);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#a78bfa";
      ctx.font = "500 28px Inter, Segoe UI, sans-serif";
      ctx.fillText(lines[2], width / 2, 198);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
      sprite.scale.set(worldW, worldH, 1);
      return sprite;
    }

    const starsGeo = new THREE.BufferGeometry();
    const starCount = 1600;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      starPos[i * 3] = (Math.random() - 0.5) * 110;
      starPos[i * 3 + 1] = Math.random() * 48 + 1;
      starPos[i * 3 + 2] = (Math.random() - 0.5) * 110;
    }
    starsGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(
      starsGeo,
      new THREE.PointsMaterial({ color: 0xa78bfa, size: 0.09, transparent: true, opacity: 0.75 })
    ));

    const title = makeTitleSprite(
      ["DATA SCIENCE  ·  AI ENGINEERING", "MUZAQIL HESENLI", "Computer Engineering · Baku Engineering University"],
      1400,
      240,
      8,
      1.35
    );
    title.position.set(0, 11.6, 0);
    scene.add(title);

    const links = new CSS2DObject(document.getElementById("links"));
    links.position.set(-15.5, 2.2, -1);
    scene.add(links);

    const stats = new CSS2DObject(document.getElementById("stats"));
    stats.position.set(15.5, 2.6, -1);
    scene.add(stats);

    const neural = new THREE.Group();
    neural.position.set(-13.5, 2.6, -6);
    scene.add(neural);
    const layers = [6, 10, 8, 5, 3];
    const nodeMeshes = [];
    const nodeMat = new THREE.MeshStandardMaterial({
      color: 0x5eead4,
      emissive: 0x2dd4bf,
      emissiveIntensity: 0.7,
      roughness: 0.22,
      metalness: 0.5,
    });
    layers.forEach((count, li) => {
      for (let n = 0; n < count; n++) {
        const m = new THREE.Mesh(new THREE.SphereGeometry(0.2, 18, 18), nodeMat);
        m.position.set(li * 1.28, (n - (count - 1) / 2) * 0.68, 0);
        neural.add(m);
        nodeMeshes.push({ mesh: m, layer: li });
      }
    });
    const lineMat = new THREE.LineBasicMaterial({ color: 0xa78bfa, transparent: true, opacity: 0.32 });
    for (let li = 0; li < layers.length - 1; li++) {
      const a = nodeMeshes.filter((n) => n.layer === li);
      const b = nodeMeshes.filter((n) => n.layer === li + 1);
      a.forEach((from) => {
        b.forEach((to) => {
          if (Math.random() > 0.5) return;
          neural.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([from.mesh.position, to.mesh.position]), lineMat));
        });
      });
    }
    makeLabel("Neural net", new THREE.Vector3(-13.5, 6.6, -6));

    const tensors = new THREE.Group();
    tensors.position.set(13.2, 1.6, -5.5);
    scene.add(tensors);
    const glass = new THREE.MeshPhysicalMaterial({
      color: 0x5eead4,
      metalness: 0.12,
      roughness: 0.1,
      transmission: 0.6,
      transparent: true,
      opacity: 0.9,
      emissive: 0x0f766e,
      emissiveIntensity: 0.35,
    });
    for (let x = 0; x < 3; x++) {
      for (let y = 0; y < 3; y++) {
        for (let z = 0; z < 3; z++) {
          const cube = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), glass);
          cube.position.set((x - 1) * 0.88, y * 0.88, (z - 1) * 0.88);
          cube.userData.baseY = cube.position.y;
          cube.userData.phase = Math.random() * Math.PI * 2;
          tensors.add(cube);
        }
      }
    }
    makeLabel("Tensor lattice", new THREE.Vector3(13.2, 5.4, -5.5));

    const city = new THREE.Group();
    scene.add(city);
    makeLabel("Contribution city", new THREE.Vector3(0, 7.2, 0));
    const palette = [0x121826, 0x134e4a, 0x0f766e, 0x2dd4bf, 0x5eead4];
    let bars = [];

    function clearCity() {
      for (const mesh of bars) {
        city.remove(mesh);
        mesh.geometry.dispose();
        mesh.material.dispose();
      }
      bars = [];
    }

    async function buildCity() {
      clearCity();
      const res = await fetch("https://github-contributions-api.jogruber.de/v4/Muzaqil555");
      const data = await res.json();
      const days = data.contributions || [];
      const cols = 53;
      const rows = 7;
      const gap = 0.46;
      const startX = -((cols - 1) * gap) / 2;
      const startZ = -((rows - 1) * gap) / 2;
      days.slice(-cols * rows).forEach((day, i) => {
        const week = Math.floor(i / rows);
        const dow = i % rows;
        const level = Math.max(0, Math.min(4, day.level ?? 0));
        const target = 0.22 + (day.count || 0) * 0.17 + level * 0.38;
        const mat = new THREE.MeshStandardMaterial({
          color: palette[level],
          emissive: palette[level],
          emissiveIntensity: 0.28 + level * 0.16,
          roughness: 0.24,
          metalness: 0.32,
        });
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.36, 1, 0.36), mat);
        mesh.position.set(startX + week * gap, 0.05, startZ + dow * gap);
        mesh.scale.y = 0.04;
        mesh.userData.target = target;
        mesh.userData.phase = Math.random() * Math.PI * 2;
        city.add(mesh);
        bars.push(mesh);
      });
    }

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.72, 0.65, 0.18);
    composer.addPass(bloom);

    function resize() {
      const w = innerWidth;
      const h = innerHeight;
      renderer.setSize(w, h, false);
      composer.setSize(w, h);
      bloom.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      labels.setSize(w, h);
    }
    resize();
    window.addEventListener("resize", resize);

    async function loadHiggsfield() {
      const loader = new GLTFLoader();
      for (const url of HIGGSFIELD_NEURAL) {
        try {
          const gltf = await loader.loadAsync(url);
          const model = gltf.scene;
          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3()).length() || 1;
          model.scale.setScalar(2.6 / size);
          model.position.set(0, 2.2, -22);
          scene.add(model);
          makeLabel("Higgsfield neural 3D", new THREE.Vector3(0, 5.4, -22));
          return;
        } catch {
          /* try next */
        }
      }
    }

    let growing = true;
    let growT = 0;
    async function rebuild() {
      growing = true;
      growT = 0;
      await buildCity();
    }
    await Promise.all([rebuild(), loadHiggsfield()]);

    const statImgs = [...document.querySelectorAll("#stats img[data-live-src]")];
    function refreshStats() {
      const t = Date.now();
      for (const img of statImgs) img.src = `${img.dataset.liveSrc}&t=${t}`;
    }
    refreshStats();

    function onscreen(el) {
      const r = el.getBoundingClientRect();
      return r.width > 0 && r.bottom > 80 && r.top < innerHeight - 80 && r.right > 40 && r.left < innerWidth - 40;
    }
    let cityOn = true;
    let statsOn = true;
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        rebuild();
        refreshStats();
      }
    });

    const clock = new THREE.Clock();
    function tick() {
      const dt = clock.getDelta();
      const t = clock.elapsedTime;
      growT += dt;
      if (growing) {
        const k = Math.min(1, growT / 1.6);
        const ease = 1 - Math.pow(1 - k, 3);
        for (const mesh of bars) {
          mesh.scale.y = 0.04 + mesh.userData.target * ease;
          mesh.position.y = mesh.scale.y / 2;
        }
        if (k >= 1) growing = false;
      } else {
        for (const mesh of bars) {
          const pulse = 1 + Math.sin(t * 1.45 + mesh.userData.phase) * 0.05;
          mesh.scale.y = mesh.userData.target * pulse;
          mesh.position.y = mesh.scale.y / 2;
        }
      }
      neural.rotation.y = Math.sin(t * 0.32) * 0.2;
      tensors.rotation.y = t * 0.24;
      tensors.children.forEach((c) => {
        c.position.y = c.userData.baseY + Math.sin(t * 1.5 + c.userData.phase) * 0.07;
      });
      ring.rotation.z = t * 0.1;
      teal.intensity = 70 + Math.sin(t * 1.2) * 12;
      violet.intensity = 60 + Math.cos(t * 1.05) * 10;

      const cityNow = onscreen(document.getElementById("links"));
      if (cityNow && !cityOn) rebuild();
      cityOn = cityNow;
      const statsNow = onscreen(document.getElementById("stats"));
      if (statsNow && !statsOn) refreshStats();
      statsOn = statsNow;

      controls.update();
      composer.render();
      labels.render(scene, camera);
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>

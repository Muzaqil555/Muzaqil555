name: Generate Arcade Games

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
      - "profile-3d-contrib/**"

concurrency:
  group: arcade-games
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake game
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#5EEAD4&color_dots=#ebedf0,#99F6E4,#5EEAD4,#14B8A6,#0F766E
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#0D1117,#134E4A,#0F766E,#2DD4BF,#5EEAD4
            dist/github-contribution-grid-snake.gif?color_snake=#5EEAD4&color_dots=#0D1117,#134E4A,#0F766E,#2DD4BF,#5EEAD4&color_background=#0D1117

      - name: Generate Pac-Man game
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      - name: Commit arcade animations
        run: |
          git config user.name "Muzaqil Hesenli"
          git config user.email "mhesenli7@std.beu.edu.az"
          git add dist/
          git commit -m "Update arcade contribution games" || exit 0
          git push
